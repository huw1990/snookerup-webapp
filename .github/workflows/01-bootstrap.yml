# This is a one-off workflow to set up everything we need to run the infrastructure workflow, i.e. the
# S3 bucket and DynamoDB table where we can store our Terraform state, and the ECR repository where our
# Docker images will be stored
name: 01 - Manually Bootstrap AWS State & ECR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: "Setup Terraform Backend & ECR"
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create Backend Infrastructure and ECR
        run: |
          set -euo pipefail
          
          AWS_REGION="${{ secrets.AWS_REGION }}"
          APP_NAME="snookerup"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="${APP_NAME}-tf-state-${ACCOUNT_ID}"
          LOCK_TABLE="${APP_NAME}-tf-locks"
          ECR_REPO_WEBAPP="${APP_NAME}-webapp"
          ECR_REPO_SEEDER="${APP_NAME}-seeder"

          echo "=== Setting up Terraform State Backend & ECR Repository in ${AWS_REGION} ==="

          # 1. Create S3 Bucket for Terraform State
          if aws s3api head-bucket --bucket "${STATE_BUCKET}" 2>/dev/null; then
              echo "S3 Bucket '${STATE_BUCKET}' already exists."
          else
              echo "Creating S3 Bucket '${STATE_BUCKET}'..."
              if [ "${AWS_REGION}" = "us-east-1" ]; then
                  aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${AWS_REGION}"
              else
                  aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${AWS_REGION}" \
                      --create-bucket-configuration LocationConstraint="${AWS_REGION}"
              fi

              # Enable Versioning
              aws s3api put-bucket-versioning --bucket "${STATE_BUCKET}" \
                  --versioning-configuration Status=Enabled

              # Enable Server-Side Encryption
              aws s3api put-bucket-encryption --bucket "${STATE_BUCKET}" \
                  --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'

              # Block Public Access
              aws s3api put-public-access-block --bucket "${STATE_BUCKET}" \
                  --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi

          # 2. Create DynamoDB Table for Terraform Locks
          if aws dynamodb describe-table --table-name "${LOCK_TABLE}" --region "${AWS_REGION}" >/dev/null 2>&1; then
              echo "DynamoDB Table '${LOCK_TABLE}' already exists."
          else
              echo "Creating DynamoDB Table '${LOCK_TABLE}'..."
              aws dynamodb create-table \
                  --table-name "${LOCK_TABLE}" \
                  --attribute-definitions AttributeName=LockID,AttributeType=S \
                  --key-schema AttributeName=LockID,KeyType=HASH \
                  --billing-mode PAY_PER_REQUEST \
                  --region "${AWS_REGION}"
          fi

          # 3. Create ECR Repository for WebApp Container
          if aws ecr describe-repositories --repository-names "${ECR_REPO_WEBAPP}" --region "${AWS_REGION}" >/dev/null 2>&1; then
              echo "ECR Repository '${ECR_REPO_WEBAPP}' already exists."
          else
              echo "Creating ECR Repository '${ECR_REPO_WEBAPP}'..."
              aws ecr create-repository \
                  --repository-name "${ECR_REPO_WEBAPP}" \
                  --image-scanning-configuration scanOnPush=true \
                  --region "${AWS_REGION}"
          fi

          # 4. Create ECR Repository for Routine Seeder Container
          if aws ecr describe-repositories --repository-names "${ECR_REPO_SEEDER}" --region "${AWS_REGION}" >/dev/null 2>&1; then
              echo "ECR Repository '${ECR_REPO_SEEDER}' already exists."
          else
              echo "Creating ECR Repository '${ECR_REPO_SEEDER}'..."
              aws ecr create-repository \
                  --repository-name "${ECR_REPO_SEEDER}" \
                  --image-scanning-configuration scanOnPush=true \
                  --region "${AWS_REGION}"
          fi

          echo "----------------------------------------------------"
          echo "Setup Complete!"
          echo "Set the following secrets in GitHub Repository Settings:"
          echo "  TF_STATE_BUCKET = ${STATE_BUCKET}"
          echo "  TF_LOCK_TABLE   = ${LOCK_TABLE}"
          echo "----------------------------------------------------"