# This is a workflow to be run every time there is a new version of the version of the SnookerUp application to
# deploy.
# Note this is triggered manually, rather than every time a commit is pushed.
name: Build & Deploy Application

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: "Build, Push ECR & Deploy to EC2"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (For ARM64 Cross-Compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push ARM64 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/snookerup-webapp:latest
            ${{ steps.login-ecr.outputs.registry }}/snookerup-webapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Update to EC2 via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying new app image" \
            --parameters 'commands=[
              "cd /opt/snookerup",
              "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ steps.login-ecr.outputs.registry }}'",
              "docker compose pull app",
              "docker compose up -d --no-deps app",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Sent SSM Command ID: $COMMAND_ID"

          # Wait for execution completion
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"