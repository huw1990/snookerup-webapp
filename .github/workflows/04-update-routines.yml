# This is a workflow to be run every time there are new routines to be added.
# Note this is triggered manually, rather than every time a commit is pushed.
name: 04 - Update Routines Data

on:
  workflow_dispatch:

jobs:
  build-and-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push ARM64 Seeder Image
        uses: docker/build-push-action@v5
        with:
          context: ./infrastructure/routine-db-import
          file: ./infrastructure/routine-db-import/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/snookerup-seeder:latest
            ${{ steps.login-ecr.outputs.registry }}/snookerup-seeder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Seeder Container on EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/snookerup",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker compose pull seeder",
              "docker compose run --rm seeder"
            ]'