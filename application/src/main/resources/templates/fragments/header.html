
<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="header">
    <nav class="bg-green-700 border-b border-green-500">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a class="flex flex-shrink-0 items-center mr-4" th:href="@{/}">
                <img
                        class="h-10 w-auto"
                        src="/images/snookerup_logo.png"
                        alt="SnookerUp"
                />
                <span class="block text-white text-2xl font-bold ml-2 drop-shadow-crisp">SnookerUp</span>
            </a>
            <button id="showMobileNavBarButton" class="inline-flex items-center border-green-900 p-2 w-10 h-10 justify-center text-sm text-white rounded-lg md:hidden">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
                </svg>
            </button>
            <div class="hidden w-full md:block md:w-auto" id="navbarButtons">
                <ul class="font-medium flex flex-col p-4 md:p-0 mt-4 border rounded-lg md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0">
                    <li>
                        <a
                                th:href="@{/}"
                                class="block my-1 md:my-0 text-white hover:bg-green-950 hover:text-white rounded-md px-3 py-2"
                        >Home</a
                        >
                    </li>
                    <li>
                        <a
                                th:href="@{/routines}"
                                class="block my-1 md:my-0 text-white hover:bg-green-950 hover:text-white rounded-md px-3 py-2"
                        >Routines</a
                        >
                    </li>
                    <li sec:authorize="isAuthenticated()">
                        <a
                                th:href="@{/scores}"
                                class="block my-1 md:my-0 text-white hover:bg-green-950 hover:text-white rounded-md px-3 py-2"
                        >Scores</a
                        >
                    </li>
                    <li sec:authorize="isAuthenticated()">
                        <a
                                th:href="@{/practicesessions}"
                                class="block my-1 md:my-0 text-white hover:bg-green-950 hover:text-white rounded-md px-3 py-2"
                        >Sessions</a
                        >
                    </li>
                    <li sec:authorize="isAuthenticated()" class="relative">
                        <button id="userDropdownButton" type="button" class="inline-flex items-center my-1 md:my-0 text-white bg-green-800 hover:bg-green-950 rounded-md px-3 py-2 border-2 border-green-800 focus:outline-none">
                            <span>[[${#authentication.principal.attributes.name}]]</span>
                            <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"/>
                            </svg>
                        </button>
                        <div id="userDropdownMenu" class="hidden absolute right-0 z-10 mt-2 w-48 bg-white divide-y divide-gray-100 rounded-lg shadow-lg">
                            <div class="py-1">
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                        Sign out
                                    </button>
                                </form>
                            </div>
                        </div>
                    </li>
                    <li sec:authorize="isAnonymous()">
                        <a
                                th:href="@{/register}"
                                class="block my-1 md:my-0 text-white hover:bg-green-950 hover:text-white rounded-md px-3 py-2 border-solid border-2 border-green-800"
                        >Sign Up</a
                        >
                    </li>
                    <li sec:authorize="isAnonymous()">
                        <a
                                th:href="@{/oauth2/authorization/cognito}"
                                class="block my-1 md:my-0 text-white hover:bg-green-950 hover:text-white rounded-md px-3 py-2 border-solid border-2 border-green-800"
                        >Log In</a
                        >
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropdownButton = document.getElementById('userDropdownButton');
            const dropdownMenu = document.getElementById('userDropdownMenu');

            if (dropdownButton && dropdownMenu) {
                dropdownButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle('hidden');
                });

                document.addEventListener('click', (e) => {
                    if (!dropdownMenu.contains(e.target) && !dropdownButton.contains(e.target)) {
                        dropdownMenu.classList.add('hidden');
                    }
                });
            }
        });
    </script>
</div>
</html>
