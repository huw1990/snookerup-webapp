<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/layout}">
<div layout:fragment="page-content">
    <section class="px-4 py-10">
        <div class="container-xl lg:container m-auto">
            <h2 class="text-3xl font-bold text-green-800 text-center font-ubuntu">
                Routines
            </h2>
            <div class="w-full max-w-2xl mx-auto px-4">
                <form id="routineFilterByTagForm" class="flex items-center justify-center py-4 md:py-8 w-full">
                    <div class="flex w-full max-w-md shadow-sm">
                        <input type="text" id="searchByTitle" name="searchByTitle" placeholder="Search by title"
                               th:value="${searchTerm != null} ? ${searchTerm} : ''"
                               class="w-full min-w-0 h-10 border-2 border-r-0 border-green-700 focus:outline-none text-green-700 rounded-l-lg px-3 py-1 text-base tracking-wider bg-white">
                        <button type="submit" class="bg-green-700 hover:bg-green-800 text-white font-medium rounded-r-lg px-4 h-10 flex items-center justify-center flex-shrink-0 transition-colors">
                            Search
                        </button>
                    </div>
                </form>
                <div class="relative mb-6">
                    <div id="pill-carousel" class="flex gap-2 sm:gap-3 overflow-x-auto no-scrollbar scroll-smooth pb-2 px-1">
                        <button th:each="tag : ${tags}" th:attr="data-tag-value=${tag}"
                                class="tag-pill px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 text-white shadow-sm flex-shrink-0"
                                th:classappend="${tag == selectedTag} ? 'bg-green-600' : 'bg-green-800'">
                            [[${tag}]]
                        </button>
                    </div>
                </div>
            </div>
            <div th:if="${routines.toList().size() == 0}">
                <h2 class="text-lg text-green-800 text-center my-12">No routines found</h2>
            </div>
            <div class="flex flex-wrap justify-center">
                <div th:each="routine : ${routines.toList()}" class="bg-green-50 flex-none min-w-full md:min-w-min max-w-full md:max-w-none m-auto md:mx-1 p-8 rounded-lg shadow-md mb-6 drop-shadow-xl border-solid border-4 border-brown">
                    <a th:href="@{/routines/{id}(id=${routine.routineId})}">
                        <h1 class="text-2xl font-bold text-green-800 mb-4 font-ubuntu">[[${routine.title}]]</h1>
                        <span th:each="tag : ${routine.tags}" class="inline-flex items-center rounded-md bg-green-200 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-green-600/20 ring-inset mx-1 mb-2">[[${tag}]]</span>
                        <img class="h-[10rem] w-auto m-auto" th:src="${routine.titleImage}"/>
                    </a>
                </div>
            </div>
            <div class="flex items-center justify-center gap-4">
                <button id="prevPageButton" th:disabled="${currentPage == 0}" th:classappend="${currentPage == 0} ? 'bg-gray-700' : 'bg-green-800'" class="block text-white text-center py-2 px-4 rounded-xl hover:bg-gray-700">Prev</button>
                <p id="pageNumberLabel" th:attr="data-current-page=${currentPage + 1},data-tag=${selectedTag}" class="text-center text-sm text-green-900" th:text="|Page ${currentPage + 1} of ${routines.getTotalPages()}|">Page 1 of 1</p>
                <button id="nextPageButton" th:disabled="${currentPage >= routines.getTotalPages() - 1}" th:classappend="${currentPage >= routines.getTotalPages() - 1} ? 'bg-gray-700' : 'bg-green-800'" class="block text-white text-center py-2 px-4 rounded-xl hover:bg-gray-700">Next</button>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="page-scripts">
    <script th:inline="javascript" type="text/javascript" th:src="@{/js/filter-and-page-routines.js}"></script>
</th:block>
</html>
